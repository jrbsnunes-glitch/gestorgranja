# /etc/nginx/sites-available/gestorgranja.com
# Painel :3020 | PWA /campo :3021 | API /api :3010
#
# Requer certificados Let's Encrypt (certbot). Se nginx -t falhar nos paths ssl,
# rode: certbot --nginx -d gestorgranja.com -d www.gestorgranja.com

server {
    listen 80;
    listen [::]:80;
    server_name gestorgranja.com www.gestorgranja.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gestorgranja.com www.gestorgranja.com;

    ssl_certificate /etc/letsencrypt/live/gestorgranja.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestorgranja.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff font/woff2;

    include /var/www/gestorgranja/deploy/nginx/snippets/gestorgranja-proxy.conf;
}
