name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint API (tsc)
        run: pnpm --filter @gestor-granja/api lint

      - name: Build API
        run: pnpm --filter @gestor-granja/api build

      - name: Build Web
        run: pnpm --filter @gestor-granja/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3010/api
