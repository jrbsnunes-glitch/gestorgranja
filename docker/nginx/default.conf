server {
  listen 80;
  server_name ~^(?<tenant>.+)\.gestorgranja\.local$;

  location /api/ {
    proxy_pass http://api:3010/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Tenant-Slug $tenant;
  }

  location / {
    proxy_pass http://web:3020;
    proxy_set_header Host $host;
  }
}
