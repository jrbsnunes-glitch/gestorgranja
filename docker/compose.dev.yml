services:
  postgres:
    image: postgres:16-alpine
    container_name: gestorgranja-postgres
    restart: unless-stopped
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: gestorgranja
      POSTGRES_PASSWORD: gestorgranja
      POSTGRES_DB: gestorgranja_central
    volumes:
      - gestorgranja_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/02-init.sql

  redis:
    image: redis:7-alpine
    container_name: gestorgranja-redis
    restart: unless-stopped
    ports:
      - "6382:6379"

volumes:
  gestorgranja_pgdata:
